<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard Flexbox</title>

    <link rel="stylesheet" href="./assets/style/style.css" />
  </head>

  <body>
    <div class="pagina">
      <!-- Barra superior -->
      <header class="barra-superior"></header>

      <!-- Contenido principal -->
      <main class="principal">
        <!-- Menú lateral -->
        <aside class="menu-lateral"></aside>

        <!-- Área de contenido -->
        <section class="contenido">
          <!-- Encabezado -->
          <div id="summary-cards">
            <header class="encabezado"></header>
          </div>
          <!-- Tarjetas -->
          <div id="charts">
            <section class="tarjetas">
              <article class="tarjeta"></article>
              <article class="tarjeta"></article>
              <article class="tarjeta"></article>
              <article class="tarjeta"></article>
            </section>
          </div>
          <!-- Zona inferior -->
          <div id="pedidos">
            <section class="zona-inferior">
              <!-- Columna principal -->
              <div class="columna-izquierda">
                <article class="caja-grande"></article>
              </div>

              <!-- Columna secundaria -->
              <div id="info-cards">
                <aside class="columna-derecha">
                  <article class="caja-derecha"></article>

                  <article class="caja-derecha"></article>
                </aside>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
